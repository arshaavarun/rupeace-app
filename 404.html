<!-- RuPeace opening screen. google/web_build.py puts this right after <body>, so it shows the moment the page starts;
     google/client/bridge.js fades it out once every main screen's data is loaded (one trip to Google).
     Fixed dark colours (not the theme tokens) so there is no light/dark flash before the app's styles decide. -->
<div id="rpSplash" role="status" aria-live="polite" aria-label="Opening RuPeace">
<style>
#rpSplash{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(120% 60% at 100% 0%,#0f2e30 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#0d2426 0%,transparent 60%),#0e1012;
  color:#eef2f2;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .32s ease,visibility .32s;}
#rpSplash.out{opacity:0;visibility:hidden}
#rpSplash.out *{animation-play-state:paused!important}  /* hidden: its animations stop, so the phone is not redrawing it all the time */
#rpSplash .rs-orbit{position:relative;width:132px;height:132px;display:grid;place-items:center}
#rpSplash .rs-ring{position:absolute;inset:0;border-radius:50%;padding:2px;
  background:conic-gradient(from 0deg,transparent 0 55%,#0d9488 72%,#0e7490 86%,transparent 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
  animation:rs-spin 1.4s linear infinite}
#rpSplash .rs-coin{position:absolute;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#ffe08a,#e2a93b);box-shadow:0 0 12px rgba(255,214,102,.7);
  top:50%;left:50%;margin:-6px;animation:rs-orbit 2.8s linear infinite}
#rpSplash .rs-coin.c2{animation-delay:-1.4s;opacity:.75;transform-origin:center}
#rpSplash .rs-logo{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;font-size:44px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#0b7a71 0%,#0d9488 55%,#0e7490 100%);box-shadow:0 18px 40px -16px rgba(135,82,196,.75);
  animation:rs-float 2.4s ease-in-out infinite}
#rpSplash .rs-logo span{display:inline-block;animation:rs-flip 2.4s ease-in-out infinite}
#rpSplash .rs-name{font-size:26px;font-weight:800;letter-spacing:-.01em;animation:rs-up .6s ease-out both .1s}
#rpSplash .rs-tag{font-size:13.5px;color:#a3a2c2;margin-top:-10px;min-height:18px;animation:rs-up .6s ease-out both .25s}
#rpSplash .rs-bar{width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
#rpSplash .rs-bar i{display:block;width:40%;height:100%;border-radius:4px;background:linear-gradient(90deg,#0f9488,#0e7490);animation:rs-load 1.1s ease-in-out infinite}
@keyframes rs-spin{to{transform:rotate(360deg)}}
@keyframes rs-orbit{from{transform:rotate(0deg) translateX(62px) rotate(0deg)}to{transform:rotate(360deg) translateX(62px) rotate(-360deg)}}
@keyframes rs-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rs-flip{0%,70%,100%{transform:rotateY(0)}85%{transform:rotateY(180deg)}}
@keyframes rs-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rs-load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#rpSplash *{animation:none!important}}
</style>
<div class="rs-orbit"><div class="rs-ring"></div><div class="rs-coin"></div><div class="rs-coin c2"></div><div class="rs-logo"><span>₹</span></div></div>
<div class="rs-name">RuPeace</div>
<div class="rs-tag" data-tag>Getting your month ready…</div>
<div class="rs-bar"><i></i></div>
</div>

<div class="shell phone-shell" id="shell">
  <main id="main" aria-live="polite"><div class="empty">Loading…</div></main>
  <nav class="bnav" aria-label="Sections">
    <a href="#/home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span>Home</span></a>
    <a href="#/ledger"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Activity</span></a>
    <button type="button" class="bnav-add" data-bnav-add aria-label="Add" title="Add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <a href="#/worth"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v17M7 21h10M4 8h16M7 8l-3 7a3 3 0 0 0 6 0zM17 8l-3 7a3 3 0 0 0 6 0z"/></svg><span>Worth</span></a>
    <a role="button" tabindex="0" data-ahead data-tab="ahead" aria-label="Ahead: loans, savings and planned expenses"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6 4 4 6-7"/><path d="M14 8h6v6"/></svg><span>Ahead</span></a>
  </nav>
